name: Armonia
options:
  bundleIdPrefix: it.personale
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.7.1"
    CURRENT_PROJECT_VERSION: "12"
targets:
  Armonia:
    type: application
    platform: iOS
    sources:
      - path: Armonia
    info:
      path: Armonia/Info.plist
      properties:
        CFBundleDevelopmentRegion: it
        CFBundleDisplayName: Armonia
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.personale.armonia
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Aurora AppIcon-Tramonto AppIcon-Oceano AppIcon-Notte AppIcon-Vetro AppIcon-Vinile AppIcon-Onda AppIcon-Neon AppIcon-Carta AppIcon-Oro AppIcon-Menta"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
